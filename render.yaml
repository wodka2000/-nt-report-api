services:
  - type: web
    name: nt-report-api
    runtime: python
    buildCommand: pip install -r web/requirements-web.txt
    startCommand: python -m web.scripts.import_reports && uvicorn web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NT_DATA_DIR
        value: /data
    disk:
      name: nt-data
      mountPath: /data
      sizeGB: 1

  - type: worker
    name: nt-report-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false           # Inserisci manualmente nella dashboard Render
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NT_DATA_DIR
        value: /data
    disk:
      name: nt-bot-data
      mountPath: /data
      sizeGB: 1
